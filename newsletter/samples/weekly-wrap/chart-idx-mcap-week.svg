<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#fcfcfb"/>
  <text x="70" y="24" font-size="15" font-weight="600" fill="#0b0b0b">IDX total market cap, 29 Jun to 3 Jul 2026 (IDR T)</text>

  <!-- gridlines -->
  <g stroke="#e7e6e2" stroke-width="1">
    <line x1="70" y1="271.3" x2="700" y2="271.3"/>
    <line x1="70" y1="213.8" x2="700" y2="213.8"/>
    <line x1="70" y1="156.4" x2="700" y2="156.4"/>
    <line x1="70" y1="98.9"  x2="700" y2="98.9"/>
    <line x1="70" y1="41.5"  x2="700" y2="41.5"/>
  </g>
  <g font-size="11" fill="#8a8a86" text-anchor="end">
    <text x="62" y="275">9,900</text>
    <text x="62" y="217">10,000</text>
    <text x="62" y="160">10,100</text>
    <text x="62" y="102">10,200</text>
    <text x="62" y="45">10,300</text>
  </g>

  <!-- x labels -->
  <g font-size="11" fill="#8a8a86" text-anchor="middle">
    <text x="70"  y="322">Mon 29 Jun</text>
    <text x="227.5" y="322">Tue 30 Jun</text>
    <text x="385" y="322">Wed 1 Jul</text>
    <text x="542.5" y="322">Thu 2 Jul</text>
    <text x="700" y="322">Fri 3 Jul</text>
  </g>

  <!-- series line -->
  <polyline fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
    points="70,110.9 227.5,274.7 385,209.3 542.5,178.8 700,50.9"/>

  <!-- markers -->
  <g fill="#2a78d6">
    <circle cx="70" cy="110.9" r="3.5"/>
    <circle cx="385" cy="209.3" r="3.5"/>
    <circle cx="542.5" cy="178.8" r="3.5"/>
  </g>
  <!-- emphasised endpoints: Tue low, Fri close -->
  <circle cx="227.5" cy="274.7" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="700" cy="50.9" r="5" fill="#2a78d6"/>

  <!-- endpoint value labels -->
  <text x="227.5" y="292" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">9,894.03 (week low)</text>
  <text x="688" y="44" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="end">10,283.56</text>
  <text x="82" y="106" font-size="11" fill="#4a4a46" text-anchor="start">10,179.25</text>
</svg>
