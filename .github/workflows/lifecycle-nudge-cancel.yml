name: Lifecycle nudge — monthly cancel check

# Defensive safety check, run the first Wednesday of the month — the day
# before the enroll run (lifecycle-nudge-enroll.yml, first Thursday) — not
# weekly, since the +30-day walkthrough step only fires roughly once a month
# per contact, so checking more often than monthly would spend GitHub Actions
# quota for no real benefit here. Cancels any active enrollment whose contact
# no longer appears in a fresh run of that nudge's approved eligibility query,
# before their next drip step would fire.
#
# Triggered by GitHub's own `schedule:` cron below, every Wednesday — moved
# here from an external scheduler (cron-job.org) calling workflow_dispatch on
# a timer, which stopped working once this repo went private. Same setup as
# lifecycle-nudge-enroll.yml, and the same two consequences carry over from
# the old cron-job.org design, both still correct under the new trigger:
#   - The date gate below keys off the real calendar date only, not
#     `github.event_name` — a native `schedule:` firing genuinely could be
#     told apart from a manual click now (`'schedule'` vs
#     `'workflow_dispatch'`), but the calendar-date gate already gives the
#     right answer either way, so there's no reason to add that branch.
#   - dry_run still defaults to "false", not "true" — a `schedule` event has
#     no `inputs` at all (same property cron-job.org's empty-body calls had),
#     so it always falls through to this default. A "true" default would
#     mean this safety check silently never actually cancels anyone, forever,
#     while still showing green every run. The tradeoff this accepts is
#     unchanged: triggering this by hand via the GitHub UI cancels for real
#     unless dry_run is explicitly set to "true" first.

on:
  schedule:
    - cron: "0 0 * * 3" # Wednesday 07:00 WIB = Wednesday 00:00 UTC (WIB is fixed UTC+7, no DST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print who would be cancelled without posting (set to true to preview — defaults to a REAL run, see comment above)"
        required: false
        default: "false"
      force_run:
        description: "Run regardless of today's date (for manual testing outside the first week)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  cancel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        nudge: [insider-nudge, setup-nudge]
      # Sequential, not parallel: both nudges share the same mailroom API key's
      # rate-limit buckets, and isolating one nudge's failure from the other
      # (fail-fast: false) matters more here than wall-clock time at this volume.
      max-parallel: 1
      fail-fast: false

    steps:
      - name: Only proceed on the first Wednesday of the month
        id: gate
        run: |
          day=$(date -u +%-d)
          if [ "$day" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "day $day is not in the first 7 days — not the first Wednesday, skipping" >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true' || github.event.inputs.force_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true' || github.event.inputs.force_run == 'true'
        with:
          node-version: "22"

      - name: Run cancel check for ${{ matrix.nudge }}
        if: steps.gate.outputs.run == 'true' || github.event.inputs.force_run == 'true'
        env:
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node .github/scripts/lifecycle-nudge.mjs cancel --nudge=${{ matrix.nudge }}
