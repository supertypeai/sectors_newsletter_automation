name: Send newsletter on merge

# Stage 2 of 2. When a drafted issue lands on main, push it to mailroom as a
# campaign. The PR merge that triggered this IS the human approval; there is no
# second gate here.
#
# The campaign is created with a schedule_at a short way out rather than sent on the
# spot, so a mistake caught right after merge can still be cancelled in the mailroom
# UI. Set MAILROOM_SCHEDULE_DELAY_MINUTES to 0 to send immediately instead.

on:
  push:
    branches: [main]
    paths:
      - "newsletter/newsletter_*_weekly-insights-v2/newsletter.html"
  workflow_dispatch:
    inputs:
      issue_folder:
        description: "Path to the issue folder to push (relative to repo root)"
        required: true
      dry_run:
        description: "Print the payload without posting"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to diff against for the push trigger.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve which issue to send
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.issue_folder }}" ]; then
            folder="${{ github.event.inputs.issue_folder }}"
          else
            # --diff-filter=A on purpose: only a newsletter.html appearing for the
            # FIRST time can trigger a send. Without this filter, any later push that
            # merely edits an already-delivered issue (a typo fix, a broken-link fix,
            # weeks after the original send) would re-trigger this same workflow and
            # create a second campaign. mailroom's Idempotency-Key would only catch
            # that within its 24h replay window (IDEMPOTENCY_TTL_MS in mailroom's own
            # constants.ts) — past that, the key has been purged and a genuine
            # duplicate send goes to the full subscriber list with nothing left to
            # stop it. A modify-only edit must never reach push-to-mailroom.mjs.
            folder=$(git diff --name-only --diff-filter=A HEAD^ HEAD \
              | grep -E '^newsletter/newsletter_.*_weekly-insights-v2/newsletter\.html$' \
              | head -1 | xargs -r dirname)
          fi
          if [ -z "$folder" ] || [ ! -d "$folder" ]; then
            echo "No issue folder resolved from this push; nothing to send." >&2
            exit 1
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Push to mailroom
        env:
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          MAILROOM_FROM: ${{ vars.MAILROOM_FROM }}
          MAILROOM_GROUP_ID: ${{ vars.MAILROOM_GROUP_ID }}
          MAILROOM_REPLY_TO: ${{ vars.MAILROOM_REPLY_TO }}
          MAILROOM_SCHEDULE_DELAY_MINUTES: ${{ vars.MAILROOM_SCHEDULE_DELAY_MINUTES || '60' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node .github/scripts/push-to-mailroom.mjs "${{ steps.resolve.outputs.folder }}"
