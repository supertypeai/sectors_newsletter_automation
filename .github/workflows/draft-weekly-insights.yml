name: Draft weekly insights

# Drafts the weekly-insights-v2 issue, emails a [TEST] copy to the reviewer, pushes
# it straight to mailroom as a `scheduled` campaign for that same day's 10am WIB
# (MAILROOM_SCHEDULE_TIME_WIB below), and commits the issue folder straight to
# main as a plain record of what was sent. There is no separate
# merge-triggers-send stage anymore (that was send-on-merge.yml's job; see
# push-to-mailroom.yml for what replaced it) — **if nobody does anything, the
# drafted issue ships to subscribers on schedule.** There is no PR to review or
# merge: review before send happens in mailroom's own Review page (cancel or
# reschedule the campaign there). Native `schedule:` below runs this every
# Monday 1am WIB — an hour chosen to sit well ahead of both the drafting time
# this needs and the 10am WIB send, with margin for GitHub Actions' own
# scheduling jitter (cron triggers are best-effort and can run late, sometimes
# by tens of minutes).

on:
  schedule:
    - cron: "0 18 * * 0" # Monday 01:00 WIB = Sunday 18:00 UTC (WIB is fixed UTC+7, no DST)
  workflow_dispatch:
    inputs:
      issue_type:
        description: "Issue type slug to draft"
        required: false
        default: "weekly-insights-v2"
      skip_draft:
        description: "Skip Claude and use a fixture issue (tests charts/upload/email for free)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Real Sectors data, real Claude, real humanizing — but no mailroom and no commit. Issue is uploaded as an artifact instead"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Where the skill writes delivered issues and looks for samples/.
      NEWSLETTER_HOME: ${{ github.workspace }}/newsletter
      # Tells the skill no human is reachable: never ask, never stall at a menu.
      NEWSLETTER_UNATTENDED: "1"
      SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
      # Authenticates against an existing Claude Pro/Max/Team/Enterprise subscription,
      # so this needs no separate pay-per-token API plan. Generate the value by running
      # `claude setup-token` locally (one-year OAuth token) and store it as a secret.
      # To bill the API instead, swap this line for:
      #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Don't set both: ANTHROPIC_API_KEY takes precedence over the OAuth token.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ISSUE_TYPE: ${{ github.event.inputs.issue_type || 'weekly-insights-v2' }}
      # Optional chart compression. Lifted to job level so the install step can test
      # for it with `env.` — the `secrets.` context is not dependable inside `if:`.
      STORING_API_KEY: ${{ secrets.STORING_API_KEY }}
      # Optional Supabase MCP connector, for real social-card auto-selection and the
      # exchange-definition foreign-flow query. Same env-indirection reasoning as
      # STORING_API_KEY above.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional prose humanizing pass. Same env-indirection reasoning as STORING_API_KEY:
      # these exist at job level only so the step's `if:` can test them. The OpenAI and
      # Anthropic keys are deliberately NOT named ANTHROPIC_API_KEY / OPENAI_API_KEY here —
      # a job-level ANTHROPIC_API_KEY would be visible to `claude -p` above and, per the
      # note on CLAUDE_CODE_OAUTH_TOKEN, would silently move drafting off the subscription
      # onto pay-per-token billing. The humanize step maps them to their real names.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HUMANIZE_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HUMANIZE_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
      HUMANIZE_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      # token: so the later "Commit the issue to main" step pushes as this
      # identity rather than the implicit default. NEWSLETTER_PAT only matters
      # if the diff ever touches .github/workflows/ — it never does here (only
      # newsletter/ is committed) — but passing it through keeps this
      # consistent with any future branch-protection rule on main.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NEWSLETTER_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail here with a readable message rather than deep inside the drafting step.
      - name: Check Claude credentials are present
        if: ${{ github.event.inputs.skip_draft != 'true' }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No Claude credential found." >&2
            echo "Set the CLAUDE_CODE_OAUTH_TOKEN secret (run 'claude setup-token' locally" >&2
            echo "to mint a one-year token against your existing subscription), or set" >&2
            echo "ANTHROPIC_API_KEY to bill the API instead." >&2
            exit 1
          fi

      # Claude Code discovers skills under .claude/skills/, so link the checkout
      # into place.
      - name: Make the skill discoverable
        run: |
          mkdir -p .claude/skills
          ln -sfn "$GITHUB_WORKSPACE/sectors-newsletter-generator" .claude/skills/sectors-newsletter-generator
          mkdir -p "$NEWSLETTER_HOME"

      # sectors.mjs and charts.mjs are dependency-free; this is only for
      # rasterize.mjs, which needs Puppeteer to turn chart SVGs into email-safe PNGs.
      - name: Install the skill's render dependency
        run: npm ci --prefix sectors-newsletter-generator || npm install --prefix sectors-newsletter-generator

      - name: Sanity check the Sectors API
        run: node sectors-newsletter-generator/scripts/sectors.mjs "idx-total/?start=2026-07-01&end=2026-07-02"

      - name: Install Claude Code
        if: ${{ github.event.inputs.skip_draft != 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      # Project-scoped .mcp.json is committed to the repo, so the real token never goes
      # there — it would leak into git history the moment a real value landed in a
      # tracked file. Instead this writes a config file to the runner's own temp
      # directory (never checked out, never committed, gone when the job ends) and
      # points --mcp-config at that path for this one invocation only. Skipped
      # entirely when the secret isn't set, so the workflow still runs (falling back
      # to generated charts and an omitted foreign-flow figure, exactly as documented
      # in SKILL.md's unattended-defaults table) for anyone who hasn't wired this up.
      - name: Write the Supabase MCP config
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          config_path="$RUNNER_TEMP/supabase-mcp.json"
          # Built with jq's --arg, not string-interpolated into a heredoc: --arg
          # JSON-escapes whatever the token contains, so a token holding a literal
          # quote or backslash still produces valid JSON. A hand-interpolated `"...${TOKEN}..."`
          # would silently corrupt the file for such a token (verified: a token
          # containing `"` broke a plain heredoc version of this same file).
          jq -n --arg token "$SUPABASE_ACCESS_TOKEN" '{
            mcpServers: {
              supabase: {
                type: "http",
                url: "https://mcp.supabase.com/mcp?project_ref=rfiycxgjbnkefczvbosm&read_only=true",
                headers: { Authorization: ("Bearer " + $token) }
              }
            }
          }' > "$config_path"
          echo "SUPABASE_MCP_CONFIG=$config_path" >> "$GITHUB_ENV"

      # TODAY_WIB is computed here, not left for Claude to infer: the runner's
      # ambient clock is UTC, and WIB is UTC+7, so for several hours after WIB
      # midnight the runner's own "today" is still the previous day. This bit a
      # real run on 2026-08-13 (stamped 12 Aug instead) — see SKILL.md Hard rule
      # 11. Every draft workflow computes and passes this explicitly now.
      - name: Draft the issue
        if: ${{ github.event.inputs.skip_draft != 'true' }}
        run: |
          TODAY_WIB=$(TZ=Asia/Jakarta date +%F)
          claude -p "Write this week's ${ISSUE_TYPE} newsletter issue using the sectors-newsletter-generator skill. Deliver to \$NEWSLETTER_HOME. Today's date in Asia/Jakarta (WIB) time is $TODAY_WIB — use this exact date as the issue date per Hard rule 11, not whatever date your own environment reports (which may be UTC and several hours behind WIB depending on when this run fires). This is an unattended CI run: do not ask any questions, apply the documented unattended defaults, and record every default you took in the separate run-notes.md file the skill documents for this — never as an HTML comment in newsletter.html, and never in the visible body or the reader-facing Appendix." \
            --permission-mode bypassPermissions \
            --model claude-sonnet-5-5 \
            --effort medium \
            ${SUPABASE_MCP_CONFIG:+--mcp-config "$SUPABASE_MCP_CONFIG"}

      # Plumbing test: everything downstream of drafting (rasterize, compress, upload,
      # main-branch commit, test email) exercised against a fixture, spending no
      # Claude usage. Use it to validate secrets before burning a real drafting run.
      - name: Build a fixture issue (skip_draft)
        if: ${{ github.event.inputs.skip_draft == 'true' }}
        run: |
          set -euo pipefail
          d="$NEWSLETTER_HOME/newsletter_$(TZ=Asia/Jakarta date +%F)_${ISSUE_TYPE}"
          mkdir -p "$d"
          node -e "
            import('./sectors-newsletter-generator/scripts/charts.mjs').then(m => {
              const svg = m.moversChart([
                { symbol: 'AAAA', value: 12.34 },
                { symbol: 'BBBB', value: -5.67 },
              ]);
              require('fs').writeFileSync('$d/chart-fixture.svg', svg);
            })
          "
          # Unquoted heredoc so $today interpolates. Keep the body free of backticks
          # and $ so nothing else gets expanded.
          today=$(TZ=Asia/Jakarta date +%F)
          cat > "$d/newsletter.md" <<MD
          ---
          subject: "[FIXTURE] pipeline test, not a real issue"
          preview: Generated without Claude to test the delivery plumbing.
          issue_type: weekly-insights-v2
          date: $today
          data_as_of: $today
          ---

          # Fixture issue

          Not real market content. Generated by the skip_draft input to exercise the
          chart, upload, commit, and test-email path without spending Claude usage.
          MD
          cat > "$d/newsletter.html" <<'HTML'
          <div style="font-family:sans-serif;padding:24px;">
            <h1>Fixture issue</h1>
            <p>Not real market content. This exercises the delivery plumbing only.</p>
            <img src="chart-fixture.png" width="536"
                 alt="Fixture chart: AAAA +12.34%, BBBB -5.67%"
                 style="display:block;width:100%;max-width:536px;height:auto;">
          </div>
          HTML
          echo "Fixture issue at $d"

      - name: Locate the delivered issue
        id: issue
        run: |
          folder=$(ls -d "$NEWSLETTER_HOME"/newsletter_*_"${ISSUE_TYPE}" 2>/dev/null | sort | tail -1)
          if [ -z "$folder" ]; then
            echo "No issue folder was produced under $NEWSLETTER_HOME" >&2
            exit 1
          fi
          for f in newsletter.md newsletter.html; do
            if [ ! -s "$folder/$f" ]; then
              echo "Missing or empty: $folder/$f" >&2
              exit 1
            fi
          done
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$folder" | sed -E 's/newsletter_([0-9-]+)_.*/\1/')" >> "$GITHUB_OUTPUT"

      # Only the prose between tags is rewritten, so charts and layout are untouched, and
      # it runs before the [TEST] email so the reviewed copy is the one that ships.
      # Exits 0 on any Gemini failure: an outage costs polish, never the send.
      - name: Humanize the prose
        if: env.GEMINI_API_KEY != '' || env.HUMANIZE_OPENROUTER_KEY != '' || env.HUMANIZE_OPENAI_KEY != '' || env.HUMANIZE_ANTHROPIC_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUMANIZE_MODELS: ${{ vars.HUMANIZE_MODELS }}
        run: node sectors-humanizer/scripts/humanize.mjs "${{ steps.issue.outputs.folder }}"

      # Charts must be hosted PNGs by the time the campaign sends: Gmail and Outlook
      # strip SVG and block data: URIs, so an SVG or inlined chart would silently
      # vanish for most subscribers. Doing this here rather than at send time means
      # both the [TEST] email and the committed record hold the real image URL.
      # Fails the run if any inline data URI survives.
      # Only needed when STORING_API_KEY is set; the publish step skips compression
      # without it, so a missing key costs bytes rather than breaking the run.
      - name: Install the Storing CLI
        if: env.STORING_API_KEY != ''
        run: npm install -g @supertype.ai/storing

      - name: Rasterize charts and host them on mailroom
        if: inputs.dry_run != true
        env:
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          MAILROOM_UPLOAD_URL: ${{ vars.MAILROOM_UPLOAD_URL || 'https://mailroom.supertype.ai/api/v1/uploads' }}
          # STORING_API_KEY comes from the job env above. Unset it and the publish
          # step skips compression, uploading charts at full size.
          STORING_PROFILE: ${{ vars.STORING_PROFILE || 'balanced' }}
          STORING_MAX_SIZE: ${{ vars.STORING_MAX_SIZE }}
        run: node .github/scripts/publish-charts.mjs "${{ steps.issue.outputs.folder }}"

      # Raw API JSON from --save-dir is scratch, never part of the reviewed diff.
      - name: Drop scratch fetches
        run: rm -rf "${{ steps.issue.outputs.folder }}"/{data,_draft}

      - name: Email the draft to the reviewer
        if: inputs.dry_run != true
        env:
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          MAILROOM_EMAIL_URL: ${{ vars.MAILROOM_EMAIL_URL || 'https://mailroom.supertype.ai/api/v1/emails' }}
          MAILROOM_FROM: ${{ vars.MAILROOM_FROM }}
          MAILROOM_TEST_TO: ${{ vars.MAILROOM_TEST_TO || 'aurellia@supertype.ai' }}
          MAILROOM_REPLY_TO: ${{ vars.MAILROOM_REPLY_TO }}
        run: node .github/scripts/send-test.mjs "${{ steps.issue.outputs.folder }}"

      # This is the actual send-gating step now that merging the PR no longer sends
      # anything: creates the real mailroom campaign, scheduled for 10am WIB the same
      # day this runs (not sent on the spot), which is what makes "review the [TEST]
      # email, then do nothing" the default outcome. Guarded by skip_draft the same
      # way the drafting/Claude steps above are — a skip_draft plumbing-test run must
      # never create a real campaign; push-to-mailroom.mjs's own [FIXTURE]-subject
      # guard is a backstop for that, not the primary defense.
      - name: Push to mailroom, scheduled for 10am WIB
        if: ${{ github.event.inputs.skip_draft != 'true' && inputs.dry_run != true }}
        env:
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          MAILROOM_API_URL: ${{ vars.MAILROOM_API_URL || 'https://mailroom.supertype.ai/api/v1/campaigns' }}
          MAILROOM_FROM: ${{ vars.MAILROOM_FROM }}
          MAILROOM_GROUP_ID: ${{ vars.MAILROOM_GROUP_ID }}
          MAILROOM_REPLY_TO: ${{ vars.MAILROOM_REPLY_TO }}
          MAILROOM_SCHEDULE_TIME_WIB: ${{ vars.MAILROOM_SCHEDULE_TIME_WIB || '10:00' }}
        run: node .github/scripts/push-to-mailroom.mjs "${{ steps.issue.outputs.folder }}"

      # The campaign above already schedules the send — this step is a plain
      # git record of what shipped, kept for history/diffing, nothing more.
      # Committed straight to main: there's no reviewer gate left for a PR to
      # provide (that's push-to-mailroom.mjs's campaign + mailroom's Review
      # page), so opening and closing one every run bought nothing but an
      # extra step and the "still-open prior PR" hazard that came with it.
      # A dry run's output leaves as a downloadable artifact rather than a commit, so a
      # test issue never lands in the newsletter/ record.
      - name: Upload the issue as an artifact (dry_run)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-${{ env.ISSUE_TYPE }}-${{ steps.issue.outputs.date }}
          path: ${{ steps.issue.outputs.folder }}
          retention-days: 14

      - name: Commit the issue to main
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter
          if git diff --cached --quiet; then
            echo "Nothing new under newsletter/ to commit" >&2
            exit 0
          fi
          git commit -m "newsletter: ${ISSUE_TYPE} ${{ steps.issue.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main
