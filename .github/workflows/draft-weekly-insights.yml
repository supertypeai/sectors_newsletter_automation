name: Draft weekly insights

# Stage 1 of 2. Drafts the Monday weekly-insights-v2 issue and opens a PR.
# Nothing reaches subscribers from this workflow; the PR review is the approval
# gate, and merging it triggers send-on-merge.yml.

on:
  schedule:
    # 07:00 WIB Monday = 00:00 UTC Monday. The type's own date rule is simply "today's
    # actual date" (see SKILL.md Hard rule 11), so this cron just needs to land on the
    # intended send day; no date arithmetic happens here or in the skill. That also
    # means a manual re-run via workflow_dispatch on any other day correctly dates
    # itself to that day, rather than a stale computed Monday.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      issue_type:
        description: "Issue type slug to draft"
        required: false
        default: "weekly-insights-v2"
      skip_draft:
        description: "Skip Claude and use a fixture issue (tests charts/upload/PR/email for free)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Where the skill writes delivered issues and looks for samples/.
      NEWSLETTER_HOME: ${{ github.workspace }}/newsletter
      # Tells the skill no human is reachable: never ask, never stall at a menu.
      NEWSLETTER_UNATTENDED: "1"
      SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
      # Authenticates against an existing Claude Pro/Max/Team/Enterprise subscription,
      # so this needs no separate pay-per-token API plan. Generate the value by running
      # `claude setup-token` locally (one-year OAuth token) and store it as a secret.
      # To bill the API instead, swap this line for:
      #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Don't set both: ANTHROPIC_API_KEY takes precedence over the OAuth token.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ISSUE_TYPE: ${{ github.event.inputs.issue_type || 'weekly-insights-v2' }}
      # Optional chart compression. Lifted to job level so the install step can test
      # for it with `env.` — the `secrets.` context is not dependable inside `if:`.
      STORING_API_KEY: ${{ secrets.STORING_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail here with a readable message rather than deep inside the drafting step.
      - name: Check Claude credentials are present
        if: ${{ github.event.inputs.skip_draft != 'true' }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No Claude credential found." >&2
            echo "Set the CLAUDE_CODE_OAUTH_TOKEN secret (run 'claude setup-token' locally" >&2
            echo "to mint a one-year token against your existing subscription), or set" >&2
            echo "ANTHROPIC_API_KEY to bill the API instead." >&2
            exit 1
          fi

      # Claude Code discovers skills under .claude/skills/, so link the checkout
      # into place.
      - name: Make the skill discoverable
        run: |
          mkdir -p .claude/skills
          ln -sfn "$GITHUB_WORKSPACE/sectors-newsletter-generator" .claude/skills/sectors-newsletter-generator
          mkdir -p "$NEWSLETTER_HOME"

      # sectors.mjs and charts.mjs are dependency-free; this is only for
      # rasterize.mjs, which needs Puppeteer to turn chart SVGs into email-safe PNGs.
      - name: Install the skill's render dependency
        run: npm ci --prefix sectors-newsletter-generator || npm install --prefix sectors-newsletter-generator

      - name: Sanity check the Sectors API
        run: node sectors-newsletter-generator/scripts/sectors.mjs "idx-total/?start=2026-07-01&end=2026-07-02"

      - name: Install Claude Code
        if: ${{ github.event.inputs.skip_draft != 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Draft the issue
        if: ${{ github.event.inputs.skip_draft != 'true' }}
        run: |
          claude -p "Write this week's ${ISSUE_TYPE} newsletter issue using the sectors-newsletter-generator skill. Deliver to \$NEWSLETTER_HOME. This is an unattended CI run: do not ask any questions, apply the documented unattended defaults, and record every default you took in the issue's appendix." \
            --permission-mode bypassPermissions

      # Plumbing test: everything downstream of drafting (rasterize, compress, upload,
      # PR push, test email) exercised against a fixture, spending no Claude usage.
      # Use it to validate secrets and the PAT before burning a real drafting run.
      - name: Build a fixture issue (skip_draft)
        if: ${{ github.event.inputs.skip_draft == 'true' }}
        run: |
          set -euo pipefail
          d="$NEWSLETTER_HOME/newsletter_$(date -u +%F)_${ISSUE_TYPE}"
          mkdir -p "$d"
          node -e "
            import('./sectors-newsletter-generator/scripts/charts.mjs').then(m => {
              const svg = m.moversChart([
                { symbol: 'AAAA', value: 12.34 },
                { symbol: 'BBBB', value: -5.67 },
              ]);
              require('fs').writeFileSync('$d/chart-fixture.svg', svg);
            })
          "
          # Unquoted heredoc so $today interpolates. Keep the body free of backticks
          # and $ so nothing else gets expanded.
          today=$(date -u +%F)
          cat > "$d/newsletter.md" <<MD
          ---
          subject: "[FIXTURE] pipeline test, not a real issue"
          preview: Generated without Claude to test the delivery plumbing.
          issue_type: weekly-insights-v2
          date: $today
          data_as_of: $today
          ---

          # Fixture issue

          Not real market content. Generated by the skip_draft input to exercise the
          chart, upload, PR and test-email path without spending Claude usage.
          MD
          cat > "$d/newsletter.html" <<'HTML'
          <div style="font-family:sans-serif;padding:24px;">
            <h1>Fixture issue</h1>
            <p>Not real market content. This exercises the delivery plumbing only.</p>
            <img src="chart-fixture.png" width="536"
                 alt="Fixture chart: AAAA +12.34%, BBBB -5.67%"
                 style="display:block;width:100%;max-width:536px;height:auto;">
          </div>
          HTML
          echo "Fixture issue at $d"

      - name: Locate the delivered issue
        id: issue
        run: |
          folder=$(ls -d "$NEWSLETTER_HOME"/newsletter_*_"${ISSUE_TYPE}" 2>/dev/null | sort | tail -1)
          if [ -z "$folder" ]; then
            echo "No issue folder was produced under $NEWSLETTER_HOME" >&2
            exit 1
          fi
          for f in newsletter.md newsletter.html; do
            if [ ! -s "$folder/$f" ]; then
              echo "Missing or empty: $folder/$f" >&2
              exit 1
            fi
          done
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$folder" | sed -E 's/newsletter_([0-9-]+)_.*/\1/')" >> "$GITHUB_OUTPUT"

      # Charts must be hosted PNGs by the time the PR is reviewed: Gmail and Outlook
      # strip SVG and block data: URIs, so an SVG or inlined chart would silently
      # vanish for most subscribers. Doing this here rather than at send time means
      # the reviewed HTML holds the real image URL and the PR preview matches the
      # delivered email. Fails the run if any inline data URI survives.
      # Only needed when STORING_API_KEY is set; the publish step skips compression
      # without it, so a missing key costs bytes rather than breaking the run.
      - name: Install the Storing CLI
        if: env.STORING_API_KEY != ''
        run: npm install -g @supertype.ai/storing

      - name: Rasterize charts and host them on mailroom
        env:
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          MAILROOM_UPLOAD_URL: ${{ vars.MAILROOM_UPLOAD_URL || 'https://mailroom.supertype.ai/api/v1/uploads' }}
          # STORING_API_KEY comes from the job env above. Unset it and the publish
          # step skips compression, uploading charts at full size.
          STORING_PROFILE: ${{ vars.STORING_PROFILE || 'balanced' }}
          STORING_MAX_SIZE: ${{ vars.STORING_MAX_SIZE }}
        run: node .github/scripts/publish-charts.mjs "${{ steps.issue.outputs.folder }}"

      # Raw API JSON from --save-dir is scratch, never part of the reviewed diff.
      - name: Drop scratch fetches
        run: rm -rf "${{ steps.issue.outputs.folder }}"/{data,_draft}

      - name: Open the review PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          # GITHUB_TOKEN can never push a change under .github/workflows/ — there is
          # no `workflows` key in `permissions:` to grant it, that scope exists only on
          # PATs and GitHub Apps. If the PR branch's diff touches a workflow file at
          # all, the push is rejected. Set a PAT with `repo` + `workflow` scope as the
          # NEWSLETTER_PAT secret to make this immune; without it, this falls back to
          # GITHUB_TOKEN, which is fine only while the diff stays inside newsletter/.
          token: ${{ secrets.NEWSLETTER_PAT || secrets.GITHUB_TOKEN }}
          base: main
          # Pathspec, not a glob: `newsletter` stages that directory and nothing else,
          # keeping .github/ out of the commit in the first place.
          add-paths: newsletter
          branch: newsletter/${{ env.ISSUE_TYPE }}-${{ steps.issue.outputs.date }}
          title: "Newsletter: ${{ env.ISSUE_TYPE }} ${{ steps.issue.outputs.date }}"
          commit-message: "newsletter: ${{ env.ISSUE_TYPE }} ${{ steps.issue.outputs.date }}"
          body: |
            Automated draft of the **${{ env.ISSUE_TYPE }}** issue for
            ${{ steps.issue.outputs.date }}.

            A `[TEST]` copy has been emailed to the reviewer — **review that, not this
            diff**. Layout bugs only show up in a real client.

            **Merging this PR sends the issue to subscribers.** `send-on-merge.yml`
            picks it up and creates the mailroom campaign, scheduled with a short
            cancellation window rather than sent on the spot.

            Before merging, check:
            - [ ] Every figure traces to a real endpoint, nothing invented
            - [ ] No investment advice framing anywhere
            - [ ] Appendix lists the unattended defaults this run took
            - [ ] The test email renders correctly in your client
            - [ ] Subject reads well in the inbox list

            The test copy goes out transactionally, so it has no unsubscribe footer,
            no `List-Unsubscribe` header, and no preview text. The campaign pipeline
            adds all three at real send time; everything else is identical.

      # After the PR on purpose: if the mail fails, the draft still survives as a PR
      # rather than being lost with the runner.
      - name: Email the draft to the reviewer
        env:
          MAILROOM_API_KEY: ${{ secrets.MAILROOM_API_KEY }}
          MAILROOM_EMAIL_URL: ${{ vars.MAILROOM_EMAIL_URL || 'https://mailroom.supertype.ai/api/v1/emails' }}
          MAILROOM_FROM: ${{ vars.MAILROOM_FROM }}
          MAILROOM_TEST_TO: ${{ vars.MAILROOM_TEST_TO || 'aurellia@supertype.ai' }}
        run: node .github/scripts/send-test.mjs "${{ steps.issue.outputs.folder }}"
